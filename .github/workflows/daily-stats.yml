name: Daily stats update

on:
  schedule:
    # 7:07 AM America/New_York — offset minute avoids top-of-hour queue delay
    - cron: '7 7 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync MLB stats
        run: node scripts/sync-mlb.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --staged --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "chore: refresh Braves stats from MLB API"
          git push
